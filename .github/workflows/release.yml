# Push a tag vX.Y.Z: tests, then a GitHub release with the prebuilt binary.
# Built on Ubuntu 22.04 (glibc 2.35, OpenSSL 3) so the binary runs on Debian 13.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          d=cairn-nas-${GITHUB_REF_NAME}-x86_64-linux
          mkdir $d
          cp target/release/cairn-nas install.sh README.md LICENSE CHANGELOG.md $d/
          tar czf $d.tar.gz $d
          sha256sum $d.tar.gz > $d.tar.gz.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " {p = index($0, v) > 0; next} p' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" cairn-nas-*.tar.gz* --title "$GITHUB_REF_NAME" --notes "$notes"
