<!DOCTYPE html>
<!-- cairn-nas (embedded in the binary). CSP: no inline JS or CSS. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cairn</title>
  <link href="icon.svg" rel="icon" type="image/svg+xml">
  <link href="panel.css" rel="stylesheet">
  <script src="i18n.js" defer></script>
  <script src="panel.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="icon.svg" class="logo" alt="">
      <div><b id="title">…</b><small id="subtitle"></small></div>
    </div>
    <nav id="nav">
      <button data-view="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span data-i18n>Overview</span></button>
      <button data-view="systeme"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg><span data-i18n>System</span></button>
      <button data-view="reseau"><svg viewBox="0 0 24 24"><path d="M4 9a12 12 0 0 1 16 0M7 13a7 7 0 0 1 10 0M10 17a2.5 2.5 0 0 1 4 0"/><circle cx="12" cy="20" r="1"/></svg><span data-i18n>Network</span></button>
      <button data-view="disques"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg><span data-i18n>Disks</span></button>
      <button data-view="stockage"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg><span data-i18n>Storage</span></button>
      <button data-view="sauvegarde" hidden><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></svg><span data-i18n>Backup</span></button>
      <button data-view="partages"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.9l7.6-3.8M8.2 13.1l7.6 3.8"/></svg><span data-i18n>Shares</span></button>
      <button data-view="comptes"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span data-i18n>Accounts</span></button>
      <button data-view="services"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span data-i18n>Services</span></button>
    </nav>
    <div class="side-foot">
      <div class="legend" id="legend"></div>
      <button class="ghost" data-act="tags" data-i18n>Tags…</button>
      <button class="ghost" data-act="theme" id="theme">Theme: auto</button>
      <button class="ghost" data-act="lang" id="lang">Language</button>
      <span class="pill user" id="user"></span>
      <button class="ghost" data-act="logout" id="logout" hidden data-i18n>Sign out</button>
    </div>
  </aside>

  <main>
    <header class="top">
      <div>
        <h1 id="view-title"></h1>
        <p class="meta" id="meta">Loading…</p>
      </div>
      <div class="pills" id="pills"></div>
    </header>
    <p class="banner" id="banner" role="alert" hidden></p>

    <section class="view" data-view="overview">
      <p class="verdict" id="verdict"></p>
      <div class="gauges" id="gauges"></div>
      <div class="grid tiles" id="tiles"></div>
      <div class="facts" id="facts"></div>
    </section>

    <section class="view" data-view="systeme" hidden>
      <div class="grid sys">
        <article class="card wide" id="cpu-card"></article>
        <article class="card" id="mem-card"></article>
        <article class="card" id="load-card"></article>
        <article class="card wide" id="temp-card"></article>
      </div>
    </section>

    <section class="view" data-view="reseau" hidden>
      <div class="grid net" id="net"></div>
    </section>

    <section class="view" data-view="disques" hidden>
      <div id="groups"></div>
    </section>

    <section class="view" data-view="stockage" hidden>
      <div class="toolbar" id="storage-actions"></div>
      <div class="grid pools" id="pools"></div>
      <h2 data-i18n>Datasets</h2>
      <div class="card table-wrap"><table id="datasets"></table></div>
      <h2 data-i18n>Snapshots</h2>
      <div class="card table-wrap"><table id="snaps"></table></div>
    </section>

    <section class="view" data-view="sauvegarde" hidden>
      <div id="repl-setup"></div>
      <h2 data-i18n>Replication</h2>
      <div class="card table-wrap"><table id="repl"></table></div>
    </section>

    <section class="view" data-view="partages" hidden>
      <article class="card" id="shares" hidden></article>
      <article class="card" id="nfs"></article>
    </section>

    <section class="view" data-view="comptes" hidden>
      <div class="stack-v" id="accounts"></div>
    </section>

    <section class="view" data-view="services" hidden>
      <article class="card" id="services"></article>
      <article class="card" id="alerts"></article>
      <article class="card" id="updates" hidden></article>
      <article class="card" id="journal"></article>
    </section>
  </main>
</div>

<dialog id="dlg" class="t-modal">
  <form method="dialog">
    <h3 id="dlg-title"></h3>
    <div id="dlg-body"></div>
    <menu>
      <button type="button" value="cancel" id="dlg-cancel" data-i18n>Cancel</button>
      <button value="ok" id="dlg-ok" class="primary">OK</button>
    </menu>
  </form>
</dialog>
</body>
</html>
